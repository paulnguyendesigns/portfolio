<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Paul Nguyen - Portfolio</title>
	<link href="https://fonts.googleapis.com/css?family=Lexend" rel='stylesheet'/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300..800&display=swap" rel="stylesheet">
    <link href="./css/header.css" rel="stylesheet"/>
    <link href="./css/footer.css" rel="stylesheet"/>
    <!--style-->
    <style>
        .about-container {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: start;
        }
        .left h1 {
            color: rgb(207, 103, 83);
            font-family: 'Dosis', sans-serif;
            font-size: 120px;
            margin-top: 100px;
            margin-left: 30px;
        }
        .right img {
            width: 100%;
        }

        .divider {
            position: absolute;
            margin-top: 80px;
            margin-left: 30px;
            width: 45%;
            height: 5px;
            background-color: rgb(240, 196, 124);
        }
        .fade-left {
            animation: fadeLeft 1s ease;
        }

        @keyframes fadeLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .fade-right {
            animation: fadeRight 1s ease;
        }
        @keyframes fadeRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <header id="header"></header>

    <main>
        <div class="about-container">
            <div class="divider fade-left"></div>
            <div class="left fade-left">
                <h1>ABOUT ME</h1>
            </div>
            <div class="right fade-right">
                <img src="headshot.jpg" alt="headshot">
            </div>
        </div>

    </main>

    <footer id="footer"></footer>

    <script src="./header-footer/load.js"></script>
    <script src="./ham_menu.js"></script>
</body>
</html>
